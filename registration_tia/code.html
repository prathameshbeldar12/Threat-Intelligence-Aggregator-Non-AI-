<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Register - Threat Intelligence Aggregator</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed-dim": "#adc6ff",
                        "primary-fixed": "#74f5ff",
                        "surface-container-lowest": "#0d0e13",
                        "on-surface": "#e3e1e9",
                        "outline-variant": "#3a494b",
                        "secondary": "#adc6ff",
                        "on-secondary-container": "#e6ecff",
                        "tertiary-fixed": "#e9ddff",
                        "secondary-fixed": "#d8e2ff",
                        "on-secondary-fixed": "#001a42",
                        "on-primary": "#00363a",
                        "on-error": "#690005",
                        "on-tertiary-fixed": "#23005c",
                        "on-secondary-fixed-variant": "#004395",
                        "tertiary-container": "#e2d4ff",
                        "on-secondary": "#002e6a",
                        "primary-container": "#00f2ff",
                        "on-primary-fixed-variant": "#004f54",
                        "on-tertiary-container": "#6f3cd8",
                        "surface": "#121318",
                        "error-container": "#93000a",
                        "inverse-primary": "#00696f",
                        "primary-fixed-dim": "#00dbe7",
                        "on-surface-variant": "#b9cacb",
                        "on-background": "#e3e1e9",
                        "on-tertiary": "#3c0091",
                        "error": "#ffb4ab",
                        "secondary-container": "#0566d9",
                        "on-primary-container": "#006a71",
                        "surface-bright": "#38393f",
                        "surface-container-highest": "#34343a",
                        "surface-variant": "#34343a",
                        "outline": "#849495",
                        "inverse-surface": "#e3e1e9",
                        "tertiary": "#fcf5ff",
                        "surface-dim": "#121318",
                        "tertiary-fixed-dim": "#d0bcff",
                        "surface-container": "#1e1f25",
                        "background": "#121318",
                        "surface-container-high": "#292a2f",
                        "on-primary-fixed": "#002022",
                        "on-tertiary-fixed-variant": "#5516be",
                        "surface-tint": "#00dbe7",
                        "on-error-container": "#ffdad6",
                        "inverse-on-surface": "#2f3036",
                        "surface-container-low": "#1a1b21",
                        "primary": "#e1fdff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",

                    },
                    "spacing": {
                        "container-padding": "24px",
                        "unit": "4px",
                        "gutter": "16px",

                    },
                    "fontFamily": {
                        "label-caps": ["JetBrains Mono"],

                },
            },
        }

<style>
        body {
            background-color: #050507;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 242, 255, 0.03) 0%, transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 242, 255, 0.04) 0%, transparent 25%);
            color: #e3e1e9;
        }
        
        .glass-panel {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .input-cyber {
            background-color: #0a0b10;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: #e3e1e9;
            transition: all 0.3s ease;
        }
        
        .input-cyber:focus {
            outline: none;
            border-bottom-color: #74f5ff;
            box-shadow: inset 0 -2px 10px rgba(116, 245, 255, 0.1);
            background-color: rgba(10, 11, 16, 0.8);
        }

        .btn-primary {
            background: linear-gradient(135deg, #74f5ff, #0566d9);
            color: #000;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            box-shadow: 0 0 15px rgba(116, 245, 255, 0.4);
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-gutter">
<!-- Ambient background grid -->
<div class="fixed inset-0 z-0 pointer-events-none opacity-20" style="background-image: linear-gradient(rgba(116, 245, 255, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(116, 245, 255, 0.1) 1px, transparent 1px); background-size: 40px 40px;"></div>
<main class="w-full max-w-md z-10 relative">
<!-- Header / Logo -->
<div class="text-center mb-stack-lg">
<h1 class="font-display-lg text-display-lg text-primary-fixed mb-unit tracking-tighter">TIA</h1>
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-[0.2em]">Threat Intelligence Aggregator</p>
</div>
<!-- Registration Card -->
<div class="glass-panel rounded-xl p-stack-lg shadow-2xl relative overflow-hidden group">
<!-- Edge glow effect -->
<div class="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-primary-fixed/50 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-700"></div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-stack-md border-b border-outline-variant/30 pb-stack-sm flex items-center gap-2">
<span class="material-symbols-outlined text-primary-fixed" style="font-variation-settings: 'FILL' 1;">person_add</span>
                Analyst Registration
            </h2>
<form class="space-y-stack-md flex flex-col">
<!-- Full Name -->
<div class="flex flex-col gap-unit">
<label class="font-label-caps text-label-caps text-on-surface-variant flex items-center gap-2" for="fullName">
<span class="material-symbols-outlined text-[14px]">badge</span> Full Name
                    </label>
<input class="input-cyber w-full py-2 px-3 font-data-mono text-data-mono rounded-t-DEFAULT" id="fullName" placeholder="Jane Doe" required="" type="text"/>
</div>
<!-- Email -->
<div class="flex flex-col gap-unit">
<label class="font-label-caps text-label-caps text-on-surface-variant flex items-center gap-2" for="email">
<span class="material-symbols-outlined text-[14px]">mail</span> Official Email
                    </label>
<input class="input-cyber w-full py-2 px-3 font-data-mono text-data-mono rounded-t-DEFAULT" id="email" placeholder="jane.doe@soc.local" required="" type="email"/>
</div>
<!-- Username -->
<div class="flex flex-col gap-unit">
<label class="font-label-caps text-label-caps text-on-surface-variant flex items-center gap-2" for="username">
<span class="material-symbols-outlined text-[14px]">terminal</span> Alias / Handle
                    </label>
<input class="input-cyber w-full py-2 px-3 font-data-mono text-data-mono rounded-t-DEFAULT" id="username" placeholder="jdoe_op" required="" type="text"/>
</div>
<!-- Password -->
<div class="flex flex-col gap-unit">
<label class="font-label-caps text-label-caps text-on-surface-variant flex items-center gap-2" for="password">
<span class="material-symbols-outlined text-[14px]">key</span> Passphrase
                    </label>
<input class="input-cyber w-full py-2 px-3 font-data-mono text-data-mono rounded-t-DEFAULT" id="password" placeholder="••••••••••••" required="" type="password"/>
<!-- Password Strength -->
<div class="w-full flex gap-1 mt-1 h-1">
<div class="flex-1 bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-error w-full"></div>
</div>
<div class="flex-1 bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-surface-container-highest w-full"></div>
</div>
<div class="flex-1 bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-surface-container-highest w-full"></div>
</div>
<div class="flex-1 bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-surface-container-highest w-full"></div>
</div>
</div>
<span class="font-label-caps text-[10px] text-error mt-1">Weak: Requires uppercase, number, symbol</span>
</div>
<!-- Confirm Password -->
<div class="flex flex-col gap-unit">
<label class="font-label-caps text-label-caps text-on-surface-variant flex items-center gap-2" for="confirmPassword">
<span class="material-symbols-outlined text-[14px]">verified</span> Confirm Passphrase
                    </label>
<input class="input-cyber w-full py-2 px-3 font-data-mono text-data-mono rounded-t-DEFAULT" id="confirmPassword" placeholder="••••••••••••" required="" type="password"/>
</div>
<!-- Terms -->
<div class="flex items-start gap-3 mt-stack-sm p-stack-sm bg-surface-container-low/50 rounded-lg border border-outline-variant/20">
<div class="flex items-center h-5">
<input class="w-4 h-4 rounded border-outline-variant bg-surface text-primary-fixed focus:ring-primary-fixed/50 focus:ring-offset-surface-container-low" id="terms" required="" type="checkbox"/>
</div>
<label class="font-body-sm text-body-sm text-on-surface-variant" for="terms">
                        I acknowledge the <a class="text-primary-fixed hover:underline decoration-primary-fixed/50" href="#">Terms of Operation</a> and verify my clearance level for accessing aggregated threat intelligence.
                    </label>
</div>
<!-- Submit Action -->
<button class="btn-primary w-full py-3 rounded-lg font-label-caps text-label-caps mt-stack-md flex items-center justify-center gap-2 uppercase font-black tracking-widest border border-primary-fixed/20" type="submit">
                    Initialize Profile <span class="material-symbols-outlined text-[18px]">rocket_launch</span>
</button>
</form>
<div class="mt-stack-lg text-center border-t border-outline-variant/30 pt-stack-sm">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Existing operative? <a class="text-primary-fixed hover:text-primary-fixed-dim transition-colors font-medium" href="#">Authenticate here</a>.
                </p>
</div>
</div>
<!-- Success Notification Area (Hidden by default) -->
<div class="hidden mt-stack-md glass-panel rounded-lg p-stack-sm border-l-2 border-primary-fixed flex items-center gap-3">
<span class="material-symbols-outlined text-primary-fixed">check_circle</span>
<p class="font-data-mono text-data-mono text-on-surface">Registration sequence initiated. Awaiting admin approval.</p>
</div>
</main>
</body></html>
